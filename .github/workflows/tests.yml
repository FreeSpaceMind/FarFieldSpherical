name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # numpy >= 2.0 is required for np.trapezoid, which needs Python 3.10+
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        # Tests needing files in tests/data/ skip themselves when absent.
        run: python -m pytest tests/ -v --tb=short

      - name: Lint for errors and undefined names
        run: |
          pip install flake8
          python -m flake8 src/ tests/ --select=E9,F63,F7,F82,F821 --show-source
