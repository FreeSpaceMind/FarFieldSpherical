name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # numpy >= 2.0 is required for np.trapezoid, which needs Python 3.10+
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Check out spherical_wave_expansion
        # Provides the optional swe package and the example .cut/.sph files
        # the reader tests use (see tests/conftest.py).
        uses: actions/checkout@v4
        with:
          repository: FreeSpaceMind/spherical_wave_expansion
          path: spherical_wave_expansion

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          pip install ./spherical_wave_expansion
          pip install -e ".[dev]"

      - name: Run tests
        # The example horn tests need a measured file that is not versioned;
        # they skip themselves when it is absent.
        env:
          FARFIELD_TEST_DATA: ${{ github.workspace }}/spherical_wave_expansion/tests
        run: python -m pytest tests/ -v --tb=short

      - name: Lint (syntax errors and every pyflakes check)
        run: |
          pip install flake8
          python -m flake8 src/ tests/ --select=E9,F --show-source
